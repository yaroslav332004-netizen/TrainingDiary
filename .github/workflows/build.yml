name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Збирання розв’язку
        run: dotnet build TrainingDiary.sln
      - name: Відомості про систему (--info)
        run: dotnet run --no-build --project TrainingDiary.App -- --info
      - name: Установлення складника копіюванням і ключ --kinds
        shell: bash
        run: |
          mkdir -p TrainingDiary.App/bin/Debug/net10.0/plugins
          cp plugins/TrainingDiary.Exercises.Interval/bin/Debug/net10.0/TrainingDiary.Exercises.Interval.dll TrainingDiary.App/bin/Debug/net10.0/plugins/
          dotnet run --no-build --project TrainingDiary.App -- --kinds
      - name: Запуск застосунку (відповіді з каналу)
        shell: bash
        run: printf '5\n5\n5\n5\n5\n' | dotnet run --no-build --project TrainingDiary.App
      - name: Пакет бібліотеки
        run: dotnet pack TrainingDiary.Core -c Release -o ./packages
      - name: Другий застосунок із пакета
        run: dotnet run --project tools/DiaryReport

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Публікація під три системи (самодостатня)
        run: bash publish.sh
      - name: Залежна збірка для порівняння
        run: dotnet publish TrainingDiary.App -c Release -r linux-x64 -o publish/linux-x64-dep
      - name: Розміри каталогів
        run: du -sh publish/*
      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/
